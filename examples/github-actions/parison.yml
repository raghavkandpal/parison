name: compare pipeline outputs

on:
  pull_request:

permissions:
  contents: read

jobs:
  parison:
    runs-on: ubuntu-latest
    env:
      PARISON_RUN: ${{ runner.temp }}/parison-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # Pin the reviewed GitHub Release asset. Update this URL deliberately.
      - name: Install Parison
        run: >-
          python -m pip install
          https://github.com/raghavkandpal/parison/releases/download/0.2.0/parison-0.2.0-py3-none-any.whl

      # Replace these example paths with outputs produced by earlier local job steps.
      - name: Require summary-only artifacts
        run: python -c "import json; assert json.load(open('examples/orders.recipe.json'))['output']['sensitivity'] == 'summary', 'CI recipe must use summary sensitivity'"

      - name: Compare outputs
        id: compare
        shell: bash
        run: |
          set +e
          parison compare \
            --recipe examples/orders.recipe.json \
            --baseline examples/baseline.csv \
            --candidate examples/candidate.csv \
            --output "$PARISON_RUN"
          code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PARISON_RUN }}
          if-no-files-found: error
          retention-days: 14

      - name: Restore Parison outcome
        if: always() && steps.compare.outputs.exit-code != ''
        shell: bash
        run: exit "${{ steps.compare.outputs.exit-code }}"
