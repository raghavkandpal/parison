name: test

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Full qualification or preflight only (preflight never qualifies integration)
        type: choice
        options: [full, preflight]
        default: full
  push:
    branches: [develop, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install 'ruff==0.17.1' build
      - run: make lint format-check docs-check
      - run: python -m build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  preflight:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist
      - name: Install shared wheel and test dependencies
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'polars==1.44.2', 'openpyxl==3.1.5', 'jsonschema>=4,<5', 'psycopg[binary]==3.3.6', *glob.glob('dist/parison-*.whl')])"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest tests.ci_smoke.InstalledSmoke -v

  native-preflight:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist
      - name: Install shared wheel and test dependencies
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'polars==1.44.2', 'openpyxl==3.1.5', 'jsonschema>=4,<5', 'psycopg[binary]==3.3.6', *glob.glob('dist/parison-*.whl')])"
      - run: python -m unittest tests.ci_native_preflight tests.ci_smoke.InstalledSmoke -v

  test:
    if: (github.event_name == 'workflow_dispatch' && inputs.profile != 'preflight') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [preflight, native-preflight]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist
      - name: Install shared wheel and test dependencies
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'polars==1.44.2', 'openpyxl==3.1.5', 'jsonschema>=4,<5', 'psycopg[binary]==3.3.6', *glob.glob('dist/parison-*.whl')])"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest tests.ci_smoke.InstalledSmoke -v

  platform-smoke:
    if: (github.event_name == 'workflow_dispatch' && inputs.profile != 'preflight') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [preflight, native-preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist
      - name: Install shared wheel and test dependencies
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'polars==1.44.2', 'openpyxl==3.1.5', 'jsonschema>=4,<5', 'psycopg[binary]==3.3.6', *glob.glob('dist/parison-*.whl')])"
      - run: python -m unittest tests.ci_platform -v

  historical:
    if: (github.event_name == 'workflow_dispatch' && inputs.profile != 'preflight') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [preflight, native-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist
      - name: Install shared wheel and test dependencies
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'polars==1.44.2', 'openpyxl==3.1.5', 'jsonschema>=4,<5', 'psycopg[binary]==3.3.6', *glob.glob('dist/parison-*.whl')])"
      - run: bash tests/ci/linux-smoke.sh
        env:
          PARISON_CI_TEMP: ${{ runner.temp }}/historical
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: parison-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/historical/parison-smoke
          if-no-files-found: error
          retention-days: 14
