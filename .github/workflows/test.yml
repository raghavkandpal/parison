name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install 'polars==1.44.2' dist/parity_compare-*.whl
      - run: parity --version
      - run: parity validate-recipe examples/orders.recipe.json
      - run: parity compare --recipe examples/orders.recipe.json --baseline examples/baseline.csv --candidate examples/candidate.csv --output /tmp/parity-smoke
      - run: parity verify /tmp/parity-smoke
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/generate_cases.py --output /tmp/parity-bench --rows 1000
      - run: python benchmarks/run_cases.py --repeats 1 --max-memory-per-row 6000 /tmp/parity-bench/rows-1000

  platform-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[parquet]'
      - run: parity --version
      - run: python -m unittest discover -s tests -v
