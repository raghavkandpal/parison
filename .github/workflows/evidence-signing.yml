name: evidence-signing

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  keyless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Export, sign and verify
        run: |
          parison statement examples/output --output parison-statement.json
          cosign sign-blob --bundle parison-statement.sigstore.json --yes parison-statement.json
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          cosign verify-blob --bundle parison-statement.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com parison-statement.json
          parison verify-statement examples/output parison-statement.json
          parison report-cutover examples/output --output cutover.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-statement-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            parison-statement.json
            parison-statement.sigstore.json
            cutover.md
