[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parity-compare"
version = "0.1.0"
description = "Local, deterministic comparison of data-pipeline outputs"
requires-python = ">=3.11"

[project.optional-dependencies]
parquet = ["polars>=1.0"]

[project.scripts]
parity = "parity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

