[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parity-compare"
dynamic = ["version"]
description = "Local, deterministic comparison of data-pipeline outputs"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
parquet = ["polars==1.44.2"]

[project.scripts]
parity = "parity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "parity.__version__"}
