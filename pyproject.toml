[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parison"
dynamic = ["version"]
description = "Local, deterministic comparison of data-pipeline outputs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
parquet = ["polars==1.44.2"]
test = ["jsonschema>=4,<5"]
dev = ["ruff==0.17.1"]

[project.scripts]
parison = "parison.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parison = ["schemas/*.json"]

[tool.setuptools.dynamic]
version = {attr = "parison.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
